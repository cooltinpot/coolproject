<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hollowed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- MAIN MENU -->
  <div id="menu" class="screen">
    <div class="fog f1"></div>
    <div class="fog f2"></div>
    <header class="title">
      <h1>HOLLOWED</h1>
      <p>Five survive. One hunts. Dawn is a long way off.</p>
    </header>

    <div class="book-area">
      <nav class="ribbons" id="chapters"></nav>
      <div id="book" class="book closed">
        <div class="cover" id="cover">
          <div class="cover-inner">
            <div class="sigil"><span></span></div>
            <h2>The Hollowed Codex</h2>
            <p class="cover-sub">Lore, abilities &amp; the art of surviving the night</p>
            <button class="btn play cover-play" data-action="play">PLAY</button>
            <p class="cover-hint">Click the book to open it</p>
          </div>
        </div>
        <div class="spread">
          <div class="page left"><div class="page-content" id="pageL"></div><div class="folio" id="folioL"></div></div>
          <div class="gutter"></div>
          <div class="page right"><div class="page-content" id="pageR"></div><div class="folio" id="folioR"></div></div>
          <div class="flip" id="flip"><div class="flip-front"></div><div class="flip-back"></div></div>
        </div>
      </div>
      <div class="book-nav">
        <button class="btn ghost" id="prevPage">◀ Prev</button>
        <button class="btn play big" data-action="play">▶ PLAY</button>
        <button class="btn ghost" id="nextPage">Next ▶</button>
      </div>
    </div>
  </div>

  <!-- SETUP -->
  <div id="setup" class="screen hidden">
    <div class="fog f1"></div>
    <div class="setup-panel parchment">
      <h2>Prepare for the Night</h2>
      <div class="row">
        <span class="label">Play as</span>
        <div class="seg" id="roleSeg">
          <button data-role="survivor" class="on">Survivor</button>
          <button data-role="killer">Killer</button>
        </div>
      </div>
      <div class="label">Choose your character</div>
      <div class="cards" id="charCards"></div>
      <div class="row" id="opponentRow">
        <span class="label">Hunted by</span>
        <div class="seg" id="oppSeg"></div>
      </div>
      <div class="label">Choose the realm</div>
      <div class="cards maps" id="mapCards"></div>
      <div class="row">
        <span class="label">Bot skill</span>
        <div class="seg" id="diffSeg"></div>
      </div>
      <div class="row end">
        <button class="btn ghost" id="backBtn">◀ Back to the Codex</button>
        <button class="btn play big" id="startBtn">BEGIN THE NIGHT</button>
      </div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="overlay hidden">
    <div class="parchment small">
      <h2>Paused</h2>
      <div id="pauseInfo"></div>
      <div class="row end">
        <button class="btn ghost" id="quitBtn">Quit to Menu</button>
        <button class="btn play" id="resumeBtn">Resume</button>
      </div>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="results" class="overlay hidden">
    <div class="parchment small wide">
      <h2 id="resTitle"></h2>
      <p class="res-sub" id="resSub"></p>
      <table class="stats" id="resTable"></table>
      <div class="row end">
        <button class="btn ghost" id="menuBtn">Main Menu</button>
        <button class="btn play" id="againBtn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
